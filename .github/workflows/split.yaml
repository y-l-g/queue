name: "Packages Split"

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  packages_split:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: "laravel"
            split_repository: "laravel-queue"
          - local_path: "symfony"
            split_repository: "symfony-queue"

    steps:
      - uses: actions/checkout@v6

      - name: Verify split token
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Missing ACCESS_TOKEN secret. It must be a token with write access to y-l-g/${{ matrix.package.split_repository }}."
            exit 1
          fi

      - if: "startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          tag: ${GITHUB_REF#refs/tags/}
          package_directory: "packages/${{ matrix.package.local_path }}"
          repository_organization: "y-l-g"
          repository_name: "${{ matrix.package.split_repository }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
